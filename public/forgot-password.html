<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - LibTickets</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .forgot-password-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #002059 0%, #003087 100%);
      padding: 2rem;
    }

    .forgot-password-card {
      background: white;
      border-radius: 12px;
      padding: 3rem;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .forgot-password-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .forgot-password-header h1 {
      color: #002059;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .forgot-password-header p {
      color: #666;
      font-size: 1rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #002059;
    }

    .form-group input.error {
      border-color: #dc2626;
    }

    .error-message {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.25rem;
      display: none;
    }

    .form-group input.error + .error-message {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #002059 0%, #003087 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 32, 89, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-back-to-login {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #e0e0e0;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-back-to-login:hover {
      background: #d0d0d0;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
    }

    .alert.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    .alert.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #dc2626;
    }

    .alert.show {
      display: block;
    }

    @media (max-width: 640px) {
      .forgot-password-card {
        padding: 2rem;
      }

      .forgot-password-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="forgot-password-container">
    <div class="forgot-password-card">
      <div class="forgot-password-header">
        <h1>?? Forgot Password</h1>
        <p>Enter your email to reset your password</p>
      </div>

      <div id="alert-success" class="alert success"></div>
      <div id="alert-error" class="alert error"></div>

      <form id="forgot-password-form">
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required>
          <div class="error-message">Please enter a valid email address</div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Send Reset Link</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="index.html#login" class="btn-back-to-login">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgot-password-form');
    const submitBtn = document.getElementById('submit-btn');
    const alertSuccess = document.getElementById('alert-success');
    const alertError = document.getElementById('alert-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Reset errors
      document.querySelectorAll('.form-group input').forEach(input => {
        input.classList.remove('error');
      });
      alertSuccess.classList.remove('show');
      alertError.classList.remove('show');

      // Get form values
      const email = document.getElementById('email').value.trim();

      // Validation
      let hasError = false;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        document.getElementById('email').classList.add('error');
        hasError = true;
      }

      if (hasError) return;

      // Submit form
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const response = await fetch('/api/request-password-reset', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: email })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to send reset link');
        }

        alertSuccess.textContent = data.message;
        alertSuccess.classList.add('show');
        form.reset();
      } catch (error) {
        alertError.textContent = error.message;
        alertError.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
