<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - LibTickets</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .reset-password-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #002059 0%, #003087 100%);
      padding: 2rem;
    }

    .reset-password-card {
      background: white;
      border-radius: 12px;
      padding: 3rem;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .reset-password-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .reset-password-header h1 {
      color: #002059;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .reset-password-header p {
      color: #666;
      font-size: 1rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #002059;
    }

    .form-group input.error {
      border-color: #dc2626;
    }

    .error-message {
      color: #dc2626;
      font-size: 0.875rem;
      margin-top: 0.25rem;
      display: none;
    }

    .form-group input.error + .error-message {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #002059 0%, #003087 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 32, 89, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .back-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
      font-size: 0.9rem;
    }

    .back-link a {
      color: #002059;
      font-weight: 600;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
    }

    .alert.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    .alert.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #dc2626;
    }

    .alert.show {
      display: block;
    }

    @media (max-width: 640px) {
      .reset-password-card {
        padding: 2rem;
      }

      .reset-password-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="reset-password-container">
    <div class="reset-password-card">
      <div class="reset-password-header">
        <h1>?? Reset Password</h1>
        <p>Enter your new password</p>
      </div>

      <div id="alert-success" class="alert success"></div>
      <div id="alert-error" class="alert error"></div>

      <form id="reset-password-form">
        <div class="form-group">
          <label for="new_password">New Password *</label>
          <input type="password" id="new_password" name="new_password" required>
          <div class="error-message">Password must be at least 8 characters</div>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
          <div class="error-message">Passwords do not match</div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Reset Password</button>
      </form>

      <div class="back-link">
        <a href="index.html#login">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('reset-password-form');
    const submitBtn = document.getElementById('submit-btn');
    const alertSuccess = document.getElementById('alert-success');
    const alertError = document.getElementById('alert-error');

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      alertError.textContent = 'Invalid or missing reset token';
      alertError.classList.add('show');
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Reset errors
      document.querySelectorAll('.form-group input').forEach(input => {
        input.classList.remove('error');
      });
      alertSuccess.classList.remove('show');
      alertError.classList.remove('show');

      // Get form values
      const newPassword = document.getElementById('new_password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      // Validation
      let hasError = false;

      if (newPassword.length < 8) {
        document.getElementById('new_password').classList.add('error');
        hasError = true;
      }

      if (newPassword !== confirmPassword) {
        document.getElementById('confirm_password').classList.add('error');
        hasError = true;
      }

      if (hasError) return;

      // Submit form
      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        const response = await fetch('/api/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            token: token,
            new_password: newPassword,
            confirm_password: confirmPassword
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to reset password');
        }

        alertSuccess.textContent = data.message;
        alertSuccess.classList.add('show');
        form.reset();

        // Redirect to login after 3 seconds
        setTimeout(() => {
          window.location.href = 'index.html#login';
        }, 3000);
      } catch (error) {
        alertError.textContent = error.message;
        alertError.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
