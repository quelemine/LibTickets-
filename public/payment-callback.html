<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment - LibTickets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 24px;
        }
        p {
            color: #718096;
            font-size: 16px;
            line-height: 1.6;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #48bb78;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
        }
        .error-icon {
            width: 80px;
            height: 80px;
            background: #f56565;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: white;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 25px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #5a67d8;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading-state">
            <div class="spinner"></div>
            <h1>Processing Payment...</h1>
            <p>Please wait while we verify your payment.</p>
        </div>

        <div id="success-state" class="hidden">
            <div class="success-icon">✓</div>
            <h1>Payment Successful!</h1>
            <p id="success-message">Your booking has been confirmed. Creating your tickets...</p>
            <a href="/" class="btn">View My Tickets</a>
        </div>

        <div id="error-state" class="hidden">
            <div class="error-icon">✗</div>
            <h1>Payment Failed</h1>
            <p id="error-message">Something went wrong with your payment.</p>
            <a href="/checkout.html" class="btn">Try Again</a>
        </div>
    </div>

    <script>
        // Payment gateway disabled for testing
        // Redirect to home page
        window.location.href = '/index.html';
    </script>
</body>
</html>
